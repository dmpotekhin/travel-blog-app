# Travel Blog Automation Platform — configuration
# All secrets live in .env (NOT here). Settings live here.

app:
  environment: development      # development | production
  timezone: UTC
  dry_run: true                 # when true, publishers skip real posts
  auto_publish: false           # never publish unapproved drafts unless true

server:
  host: 127.0.0.1
  api_port: 8000
  ui_port: 8501

archive:
  path: ""                      # path to the photo archive (1 TB)
  recursive: true               # recursively scan subfolders
  incremental: true             # skip unchanged files on rescan

schedule:
  enabled: true
  posts_per_day: 2              # cities processed per day
  publish_time: "08:00"         # local time of day to publish
  timezone: UTC

ai:
  provider: gemini              # gemini | deepseek | mock

# Visual Narrative Studio: photos + AI facts -> storyboard (arc, shots, alt-texts).
visual_narrative:
  enabled: true
  provider: mock                # mock | gemini | deepseek | local_vlm | "" (follow ai.provider)
  max_photos: 12
  require_alt_text: true
  enforce_narrative_arc: true
  allow_manual_override: true
  require_approval: false       # true = platform content waits for an approved storyboard

gemini:
  requests_per_minute: 15
  requests_per_day: 1500
  min_interval_seconds: 4.3
  retry_429_seconds: 60
  max_retries: 3
  model: "gemini-2.0-flash"     # verify current vision-capable model name
  temperature: 0.4

deepseek:
  model: "deepseek-chat"        # OpenAI-compatible text model via DeepSeek
  base_url: "https://api.deepseek.com"
  temperature: 0.6

publishing:
  facebook: true
  vk: true
  telegram: true
  zen: true
  instagram: true
  youtube: true
  trip_com: true

telegram:
  chat_id: ""                   # TELEGRAM_CHAT_ID (token in .env)

vk:
  api_version: ""               # leave empty -> resolved to latest stable at runtime
  group_id: ""                  # VK_GROUP_ID (token in .env)

facebook:
  page_id: ""                   # FACEBOOK_PAGE_ID (token in .env)

trip:
  guide_title_template: "{city} в {year}: взгляд спустя годы"

retry:
  max_attempts: 3
  initial_delay_seconds: 60
  exponential_backoff: true

media:
  jpeg_quality: 90
  video:                        # video generation defaults
    photos_per_video: 4         # 3-5 seconds each recommended
    photo_duration_seconds: 4
    resolution: "1080x1920"
    font: "Arial"

content:
  photos_per_city: 8            # how many selected photos per city by default
  max_hashtags: 10

# Platform media presets. Defaults only — check live platform docs before prod.
media_presets:
  trip_cover:
    format: JPEG
    width: 1200
    height: 800
    max_mb: 5
  trip_inner:
    format: JPEG
    width: 800
    height: 600
    max_mb: 3
  instagram_post:
    format: JPEG
    width: 1080
    height: 1080
    max_mb: 8
  instagram_stories:
    format: JPEG
    width: 1080
    height: 1920
    max_mb: 8
  instagram_reels:
    format: MP4
    width: 1080
    height: 1920
    max_mb: 100
  facebook_post:
    format: JPEG
    width: 1200
    height: 630
    max_mb: 8
  facebook_stories:
    format: JPEG
    width: 1080
    height: 1920
    max_mb: 8
  facebook_reels:
    format: MP4
    width: 1080
    height: 1920
    max_mb: 100
  youtube_shorts:
    format: MP4
    width: 1080
    height: 1920
    max_mb: 100
  youtube_full:
    format: MP4
    width: 1920
    height: 1080
    max_mb: 200
  telegram:
    format: JPEG
    width: 1280
    height: 720
    max_mb: 5
  zen:
    format: JPEG
    width: 1200
    height: 630
    max_mb: 10
  vk_post:
    format: JPEG
    width: 1200
    height: 630
    max_mb: 8
  vk_vertical:
    format: JPEG
    width: 1080
    height: 1920
    max_mb: 8

# VibeCoding content type: generated blog posts (text + image) about vibe coding.
# Secrets live in .env (REPLICATE_API_TOKEN / OPENAI_API_KEY / HUGGINGFACE_API_KEY).
vibecoding:
  enabled: true                  # master switch for the VibeCoding feature
  schedule_time: "12:00"         # local time to auto-publish scheduled VibeCoding posts
  schedule_days: [0, 1, 2, 3, 4, 5, 6]   # days of week (0=Mon ... 6=Sun)
  auto_publish: false            # true -> scheduler publishes drafts automatically
  image_generation:
    enabled: true
    provider: replicate          # replicate | openai | huggingface | mock
    model: "stability-ai/sdxl"   # DALL-E 3, stability-ai/sdxl, black-forest-labs/flux-schnell, ...
    api_key_env: "REPLICATE_API_TOKEN"
    width: 1024
    height: 1024
    num_outputs: 1
  text_generation:
    model: "deepseek-chat"       # reuses the existing DeepSeek client
    max_tokens: 1500
    temperature: 0.7
  default_prompts:
    text: "Напиши пост для блога о вайбкодинге на тему {topic}. Используй личный опыт, примеры кода, расскажи о трудностях и решениях. Стиль: живой, вдохновляющий. Объём 500-700 слов."
    image: "Футуристический кодер за рабочим столом, вокруг летают строки кода, светящиеся синим, абстрактный фон, высокотехнологичный стиль, 4k, детализированно"

# ---- Trip.com (Trip Moments) content-compliance guidelines ----
trip_guidelines:
  enabled: true                  # master switch for travel-post validation
  min_photos_attraction: 3       # minimum photos for an attraction post
  min_photos_restaurant: 5       # minimum photos for a restaurant/food post
  require_interior_photo: true   # at least one interior/setting photo
  min_words: 100
  forbidden_patterns: ["watermark", "logo", "qr", "http", "tel:", "@"]
  video_min_duration_sec: 30
  ai_disclaimer: "This post was created with the assistance of AI."
  geotag_required: true
  title_emoji_recommended: true
  saturation_boost: 1.2
  block_non_compliant: false     # soft gate: log + show in UI, do NOT block publish

# ---- VibeCoding educational/expert content-compliance guidelines ----
vibecoding_guidelines:
  enabled: true                  # master switch for VibeCoding-post validation
  min_words: 200
  max_words: 700
  min_photos: 2
  max_photos: 5
  require_code_screenshot: true
  recommend_ai_image: true
  title_max_length: 80
  hashtag_count_min: 3
  hashtag_count_max: 5
  video_min_duration_sec: 15
  video_max_duration_sec: 60
  forbidden_patterns: ["заработай", "миллион", "100%", "бесплатно"]
  engagement_question_required: true
  default_engagement_question: "А какой инструмент используешь ты? Делитесь в комментариях!"
  ai_image_prompt_template: "Футуристический кодер, строки кода, абстрактный фон, стиль технологичный"
  block_non_compliant: false     # soft gate: log + show in UI, do NOT block publish

# ---- Tri-Face Carousel Factory (ADR-107) ----
# Three faces: travel | qa | vibecoding. Primary entry points: a URL or a
# GitHub ref (repo/issue/PR/discussion/release) -> 6-slide 768x1376 JPG
# carousel for TikTok + Instagram, with a human approval in between.
carousels:
  enabled: true
  # supervised = a human approves before publish (default, keep it that way).
  # full_autonomous only relaxes the gate when require_human_approval is also false.
  mode: supervised
  require_human_approval: true
  default_vertical: hybrid       # travel | qa | vibecoding | hybrid
  slide_count: 6
  resolution:
    width: 768
    height: 1376
  format: jpg                    # TikTok rejects PNG — JPG only
  aspect_ratio: "9:16"
  bottom_safe_zone_percent: 20   # TikTok UI overlays live in the bottom 20%
  max_regeneration_attempts: 2
  output_dir: public/carousels
  renderer: pillow               # pillow | html | mock
  hook_candidates_min: 3
  hook_candidates_max: 5
  target_platforms: [tiktok, instagram]
  sources:
    url:
      enabled: true
      timeout_seconds: 30
      cache_ttl_seconds: 3600
      extract_code_blocks: true
      extract_images: true
      extract_brand_colors: true
      min_request_interval_seconds: 1.0
      respect_robots_txt: true
      max_redirects: 5
    github:
      enabled: true
      api_base: https://api.github.com
      use_gh_cli_if_available: true
      include_readme: true
      include_issues: true
      include_prs: true
      include_discussions: true
      include_releases: true
      max_comments: 50
      timeout_seconds: 30
  verticals:
    travel:
      preferred_sources: [city, photo_archive, article_url, url]
      default_narrative_template: travel_hook_reality_route_cta
      hook_categories: [hidden_place, expectation_vs_reality, budget, solo_travel,
                        cultural_contrast, route_guide, personal_experience,
                        secret_spot, seasonality]
      slide_types: [hero_hook, photo_card, problem, solution, route_map, cta]
      visual_style: cinematic_documentary
      caption_style: personal_story
      hashtag_strategy: travel_location_season
      cta_strategy: save_before_trip
      forbidden: [fake_landmarks_presented_as_real, sensitive_people_without_consent,
                  exact_prices_without_source]
    qa:
      preferred_sources: [github_issue, github_pr, test_report, code_snippet,
                          qa_artifact, url]
      default_narrative_template: qa_incident_detective_checklist
      hook_categories: [failure, contrarian, number_list, mystery, cost,
                        before_after, myth_busting, flaky_test, ci_slowdown, root_cause]
      slide_types: [hero_hook, symptom, agitation, investigation, fix_code,
                    prevention_checklist]
      visual_style: technical_clean
      caption_style: engineering_postmortem
      hashtag_strategy: testing_ci_quality
      cta_strategy: save_checklist
      forbidden: [invented_root_cause, invented_metrics, invented_code,
                  truncated_code_without_warning]
    vibecoding:
      preferred_sources: [vibecoding_session, vibecoding_post, github_repo, url,
                          manual_topic, code_snippet]
      default_narrative_template: vibecoding_claim_old_new_evidence_cta
      hook_categories: [speed, local_ai, agent_workflow, prompt_to_product,
                        experiment, anti_pattern, stack_tour, ai_vs_human,
                        evening_build, tool_comparison]
      slide_types: [bold_claim, task_context, old_way, new_way, metrics_comparison,
                    architecture_diagram, cta]
      visual_style: futuristic_minimal
      caption_style: builder_diary
      hashtag_strategy: ai_agents_local_llm_automation
      cta_strategy: comment_keyword_for_prompt
      forbidden: [hype_without_evidence, invented_benchmarks, fake_screenshots,
                  undisclosed_cloud_usage_when_claiming_local]
    hybrid: {}                   # neutral profile: uses built-in defaults
  gemini:
    enabled: true
    model: gemini-3.1-flash-image-preview
    # QA/Vibecoding: Gemini paints backgrounds ONLY; text/code/metrics are
    # composited deterministically (Pillow/HTML), never drawn by the model.
    use_for_background_only_in_technical_verticals: true
    reuse_first_slide_as_reference: true
  upload_post:
    enabled: true
    base_url: https://api.upload-post.com
    auto_add_music: true
    privacy_level: PUBLIC_TO_EVERYONE
    async_upload: true
    max_retries: 2
    timeout_seconds: 120
  analytics:
    enabled: true
    collect_after_hours: 24
    recollect_after_hours: 72
    max_posts_per_run: 50
  learning:
    enabled: true
    min_sample_size: 3
    rolling_history: 100
    auto_apply_recommendations: false   # supervised mode: recommend, never auto-apply
  # Composite score weights (config.yaml §performance_lab of the task spec).
  # Kept under `carousels:` deliberately: one source of truth for the weights.
  performance_lab:
    weights:
      views: 0.20
      likes: 0.25
      comments: 0.20
      shares: 0.15
      saves: 0.10
      approval: 0.05
      rejection_penalty: 0.05
    min_sample_size: 3
    rolling_history: 100
  health:
    min_source_confidence: 0.5
    require_source_refs_for_facts: true
    require_alt_text: true
    require_approval_for_publish: true
    max_headline_chars: 90
    max_bullets_per_slide: 5
    max_body_lines: 3
